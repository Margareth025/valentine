<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Carte Anonyme Premium</title>

<!-- Icônes officielles Font Awesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&display=swap');

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'Montserrat',sans-serif;
  background:#0d0d0d;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* Carte */
.container{
  width:95%;
  max-width:520px;
  padding:40px;
  border-radius:20px;
  background:linear-gradient(145deg,#141414,#1c1c1c);
  box-shadow:0 0 50px rgba(255,0,140,.25);
  text-align:center;
}

h1{
  font-weight:800;
  background:linear-gradient(90deg,#ff1493,#ff6ec7);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  border:none;
  background:#222;
  color:#fff;
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#ff1493;
  color:white;
  cursor:pointer;
}

.share{
  margin-top:20px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}

.share button{
  background:#1e1e1e;
  color:#fff;
  border:none;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
}

.messages{
  margin-top:20px;
  max-height:260px;
  overflow-y:auto;
}

.message{
  background:#1e1e1e;
  padding:10px;
  border-radius:8px;
  margin-bottom:8px;
}
</style>
</head>

<body>

<div class="container">

<h1>💌 Message Anonyme</h1>

<div id="sendSection">
  <input id="pseudo" placeholder="Pseudo du destinataire">
  <input id="message" placeholder="Votre message secret">
  <button class="btn" onclick="sendMessage()">Envoyer</button>

  <div id="shareBox" class="share" style="display:none;">
    <button onclick="shareWhatsApp()"><i class="fab fa-whatsapp"></i></button>
    <button onclick="shareMessenger()"><i class="fab fa-facebook-messenger"></i></button>
    <button onclick="shareLinkedIn()"><i class="fab fa-linkedin"></i></button>
    <button onclick="shareEmail()"><i class="fas fa-envelope"></i></button>
    <button onclick="copyLink()"><i class="fas fa-link"></i></button>
  </div>
</div>

<div id="receiveSection" style="display:none;">
  <h3>Messages pour <span id="currentUser"></span></h3>
  <div id="messages" class="messages"></div>
</div>

</div>

<!-- Firebase CDN (compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ========= FIREBASE ========= */
const firebaseConfig = {
  apiKey: "AIzaSyCTzCS_clkx8VzStAMIey3D-I9ca79UXz0",
  authDomain: "valentine-anonyme.firebaseapp.com",
  projectId: "valentine-anonyme"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ========= ENVOI ========= */
const pseudoInput = document.getElementById("pseudo");
const messageInput = document.getElementById("message");
const shareBox = document.getElementById("shareBox");

function sendMessage(){
  const pseudo = pseudoInput.value.trim();
  const msg = messageInput.value.trim();

  if(!pseudo || !msg) return alert("Remplissez les champs");

  // Envoi du message à Firestore
  db.collection("messages").add({
    recipient: pseudo,
    message: msg,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  });

  // Génération du lien
  if(location.origin.includes("127.0.0.1") || location.origin.includes("localhost")){
    window.generatedLink = "https://message-margareth.netlify.app/?user=" + encodeURIComponent(pseudo);
  } else {
    window.generatedLink = location.origin + location.pathname + "?user=" + encodeURIComponent(pseudo);
  }

  // Afficher les boutons de partage
  shareBox.style.display = "flex";

  // Réinitialiser les champs
  messageInput.value = "";
  pseudoInput.value = "";
}

/* ========= PARTAGE ========= */
function shareWhatsApp(){
  open("https://api.whatsapp.com/send?text="+encodeURIComponent(window.generatedLink));
}

function shareMessenger(){
  open("https://www.facebook.com/dialog/send?link="+encodeURIComponent(window.generatedLink));
}

function shareLinkedIn(){
  open("https://www.linkedin.com/sharing/share-offsite/?url="+encodeURIComponent(window.generatedLink));
}

function shareEmail(){
  location.href="mailto:?body="+window.generatedLink;
}

function copyLink(){
  navigator.clipboard.writeText(window.generatedLink);
  alert("Lien copié !");
}

/* ========= RECEVOIR ========= */
const params = new URLSearchParams(location.search);
const user = params.get("user");

if(user){
  document.getElementById("sendSection").style.display="none";
  document.getElementById("receiveSection").style.display="block";
  document.getElementById("currentUser").textContent = user;

  db.collection("messages")
    .orderBy("timestamp","desc") // Pas de where pour éviter l'index
    .onSnapshot(snap=>{
      const box = document.getElementById("messages");
      box.innerHTML = "";
      snap.forEach(doc=>{
        const data = doc.data();
        // Filtrer côté JS et ignorer la casse
        if(data.recipient.toLowerCase() === user.toLowerCase()){
          box.innerHTML += `<div class="message">${data.message}</div>`;
        }
      });
    });
}
</script>

</body>
</html>
